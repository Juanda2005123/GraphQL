version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    container_name: inmobiliaria_postgres_db
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inmobiliaria_db
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
