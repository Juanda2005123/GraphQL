services:
  # Servicio de la API NestJS
  - type: web
    name: real-estate-graphql-api
    runtime: node
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto automáticamente
      - key: DATABASE_URL
        fromDatabase:
          name: real-estate-db
          property: connectionString
    autoDeploy: true

# Base de datos PostgreSQL
databases:
  - name: real-estate-db
    databaseName: real_estate_db
    user: real_estate_user
    plan: free # Tier gratuito de Render
